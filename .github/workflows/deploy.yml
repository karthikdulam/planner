name: Deploy to GitHub Pages

on:
  push:
    branches: [development, main, master]
  workflow_dispatch:        # lets you trigger a deploy by hand from the Actions tab

# Least privilege needed for the Pages deploy
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. Don't cancel a run that is mid-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Switches the Pages source to "GitHub Actions" via the API.
      # Without this, Pages keeps serving the raw repo root (the Vite dev
      # index.html, which points at /src/main.jsx and 404s) and the
      # deploy-pages step below fails.
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        # vite.config.js sets base: './' so the bundle works from any
        # sub-path — https://<user>.github.io/<repo>/ included. Routing is
        # HashRouter, so deep links need no server-side rewrites.

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
